<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בודק אבטחת סיסמאות (Pwned Passwords)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 360px;
      text-align: center;
    }
    h2 {
      color: #38bdf8;
      margin-top: 0;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
    }
    .safe {
      background-color: #065f46;
      color: #34d399;
    }
    .pwned {
      background-color: #991b1b;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>בדיקת דליפת סיסמאות 🔒</h2>
    <p>הזן סיסמה לבדיקה מול מאגר הדלפות עולמי (הסיסמה נבדקת מוצפנת בלבד).</p>
    
    <input type="password" id="passwordInput" placeholder="הכנס סיסמה לבדיקה...">
    <button onclick="checkPassword()">בדוק אבטחה</button>

    <div id="resultBox" class="result"></div>
  </div>

  <script>
    async function sha1(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-1', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    async function checkPassword() {
      const password = document.getElementById('passwordInput').value;
      const resultBox = document.getElementById('resultBox');

      if (!password) {
        alert('אנא הזן סיסמה לבדיקה');
        return;
      }

      resultBox.style.display = 'block';
      resultBox.className = 'result';
      resultBox.textContent = 'בודק מול מסד הנתונים...';

      try {
        const fullHash = await sha1(password);
        const prefix = fullHash.substring(0, 5);
        const suffix = fullHash.substring(5);

        const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
        const textData = await response.text();

        const lines = textData.split('\n');
        let pwnedCount = 0;

        for (const line of lines) {
          const [hashSuffix, count] = line.trim().split(':');
          if (hashSuffix === suffix) {
            pwnedCount = parseInt(count, 10);
            break;
          }
        }

        if (pwnedCount > 0) {
          resultBox.className = 'result pwned';
          resultBox.textContent = `⚠️ הסיסמה הופיעה ${pwnedCount.toLocaleString()} פעמים בהדלפות מידע! לא מומלץ לשימוש.`;
        } else {
          resultBox.className = 'result safe';
          resultBox.textContent = '✅ הסיסמה לא נמצאה במאגר ההדלפות הידועות.';
        }

      } catch (error) {
        console.error(error);
        resultBox.className = 'result pwned';
        resultBox.textContent = 'ארעה שגיאה במהלך הבדיקה.';
      }
    }
  </script>

</body>
</html>
